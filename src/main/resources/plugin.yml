name: ElytrasOfFire
version: 0.1.0
main: org.woftnw.eof.ElytrasOfFire
description: Introduce the world of Wings of Fire to Minecraft!
author: "Wings of Fire: The New World"
contributors: [BogTheMudWing]
website: https://woftnw.org
api-version: '26.3'
load: POSTWORLD

permissions:
  eof.tribe.set:
    description: "Set own tribe."
    default: true
  eof.tribe.set.others:
    description: "Set others' tribes."
    default: false
  eof.attributes.set:
    description: "Toggle own attributes."
    default: true
  eof.attributes.set.others:
    description: "Toggle others' attributes."
    default: false
  eof.abilities.set:
    description: "Toggle own abilities."
    default: true
  eof.abilities.set.others:
    description: "Toggle others' abilities."
    default: false
  eof.abilities.bypass_cooldown:
    description: "Bypass ability cooldowns."
    default: false

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build

  javadoc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate Javadoc
        # You may pin to the exact commit or the version.
        # uses: MathieuSoysal/Javadoc-publisher.yml@fda475b197081ba1eca7a1dfadf0c017080a1623
        uses: MathieuSoysal/Javadoc-publisher.yml@v3.0.2
        with:
          # Java version inside your project
          java-version: 25 # default is 17
          # The GitHub token the GitHub repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deploy mode branch or artifact
          deploy-mode: artifact # default is branch
          # Branch where the javadoc is hosted
          # javadoc-branch: # optional, default is javadoc
          # Directory where the javadoc contents should be stored
          # target-folder: # optional, default is .
          # Java distribution inside your project
          # java-distribution: # optional, default is adopt
          # Maven or Gradle project
          project: gradle # optional, default is maven
          # Custom command to generate the javadoc
          # custom-command: # optional, default is
          # Custom subdirectories to upload from
          # subdirectories: # optional
          # Custom path for the new Javadoc
          # javadoc-source-folder: # optional
          # Enable or disable deploy of the javadoc to the GitHub Page
          without-deploy: true # optional, default is false
          # Enable or disable the checkout
          # without-checkout: # optional, default is false